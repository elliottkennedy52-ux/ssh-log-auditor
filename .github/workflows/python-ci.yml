name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-smoke-test:
    name: Ruff Lint & CLI Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff linter
        run: pip install ruff

      - name: Run Ruff lint checks
        run: ruff check --ignore E501 .

      - name: Verify CLI entrypoint
        run: python3 auditor.py --help
