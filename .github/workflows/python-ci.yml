name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test-and-smoke:
    name: Ruff Lint, Pytest & CLI Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff and Pytest
        run: pip install ruff pytest

      - name: Run Ruff lint checks
        run: ruff check --ignore E501 .

      - name: Run unit tests with pytest
        run: PYTHONPATH=. pytest -v

      - name: Verify CLI entrypoint
        run: python3 auditor.py --help
